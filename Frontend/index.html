<body style="background-color: #001e3d; margin: 0; padding: 0;">
  <script>
    (function () {
      try {
        if (localStorage.getItem('tdv_night_dive') === 'true') {
          document.documentElement.classList.add('night-dive');
          document.body.classList.add('night-dive');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Global Ambient Audio Stream (Loaded and playing from millisecond zero) -->
  <audio
    id="tdv-global-ambient-audio"
    src="/media/TDV-Media/Audio/Audio.mp3"
    autoplay
    loop
    preload="auto"
    crossorigin="anonymous"
    playsinline
    webkit-playsinline
    style="display:none;position:fixed;pointer-events:none;"
  ></audio>
  <!-- In-DOM Hero 360 Video Stream (Buffering from millisecond zero) -->
  <div
    id="hero-360-video-dom-root"
    style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0.001;pointer-events:none;overflow:hidden;z-index:-99999;"
  >
    <video
      id="hero-360-dom-video"
      src="/media/TDV-Media/Background/ClownFish.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous"
    ></video>
  </div>
  <script>
    (function () {
      try {
        var audio = document.getElementById('tdv-global-ambient-audio');
        if (!audio) return;
        var isMuted = localStorage.getItem('tdv_audio_muted') === 'true';
        if (isMuted) {
          audio.muted = true;
          audio.volume = 0;
          return;
        }

        audio.volume = 0.5;

        var startPlay = function () {
          if (localStorage.getItem('tdv_audio_muted') === 'true') return;
          if (document.hidden) return;
          audio.muted = false;
          audio.volume = 0.5;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function () {
              audio.muted = false;
              audio.volume = 0.5;
              if ('mediaSession' in navigator && typeof MediaMetadata !== 'undefined') {
                try {
                  navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Underwater Ambiance',
                    artist: 'The Dive Village',
                    album: "It's a Community",
                    artwork: [{ src: 'https://res.cloudinary.com/q7b4kjd9/image/upload/v1791691225/TDV-Media/UI/Logo.png', sizes: '512x512', type: 'image/png' }]
                  });
                } catch (e) {}
              }
            }).catch(function () {
              // If unmuted autoplay blocked on initial boot, play muted so stream runs
              audio.muted = true;
              audio.play().catch(function () {});
            });
          }
        };

        startPlay();
        document.addEventListener('DOMContentLoaded', startPlay, { once: true });
        window.addEventListener('load', startPlay, { once: true });

        // Unmute on ANY micro-gesture (cursor movement, wheel, touch, scroll, focus, key) without needing a click
        var microEvents = ['mousemove', 'pointermove', 'pointerdown', 'touchstart', 'mousedown', 'keydown', 'wheel', 'scroll', 'focus'];
        var onMicroGesture = function () {
          if (localStorage.getItem('tdv_audio_muted') === 'true') return;
          if (document.hidden) return;
          if (audio.muted || audio.paused) {
            audio.muted = false;
            audio.volume = 0.5;
            var p = audio.play();
            if (p !== undefined) {
              p.then(function () {
                audio.muted = false;
                audio.volume = 0.5;
                if ('mediaSession' in navigator && typeof MediaMetadata !== 'undefined') {
                  try {
                    navigator.mediaSession.metadata = new MediaMetadata({
                      title: 'Underwater Ambiance',
                      artist: 'The Dive Village',
                      album: "It's a Community",
                      artwork: [{ src: 'https://res.cloudinary.com/q7b4kjd9/image/upload/v1791691225/TDV-Media/UI/Logo.png', sizes: '512x512', type: 'image/png' }]
                    });
                  } catch (e) {}
                }
                microEvents.forEach(function (e) {
                  window.removeEventListener(e, onMicroGesture, true);
                  document.removeEventListener(e, onMicroGesture, true);
                });
              }).catch(function () {});
            }
          }
        };
        microEvents.forEach(function (e) {
          window.addEventListener(e, onMicroGesture, { capture: true, passive: true });
          document.addEventListener(e, onMicroGesture, { capture: true, passive: true });
        });
      } catch (e) {}
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
