<body style="background-color: #001e3d; margin: 0; padding: 0;">
  <script>
    (function () {
      try {
        var path = (window.location.pathname || '/').split('?')[0].split('#')[0].trim().toLowerCase().replace(/\/+$/, '') || '/';
        var isNightAllowed = path === '/' || path === '/about';
        if (isNightAllowed && localStorage.getItem('tdv_night_dive') === 'true') {
          document.documentElement.classList.add('night-dive');
          document.body.classList.add('night-dive');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Global Ambient Audio Stream (Loaded and playing from millisecond zero) -->
  <audio
    id="tdv-global-ambient-audio"
    src="https://media.thedivevillage.com/TDV-Media/Audio/Audio.mp3"
    autoplay
    loop
    preload="auto"
    crossorigin="anonymous"
    playsinline
    webkit-playsinline
    style="display:none;position:fixed;pointer-events:none;"
  ></audio>
  <!-- In-DOM Hero 360 Video Stream initialized by mediaReadyManager with Cloudflare R2 HLS -->
  <script>
    (function () {
      try {
        var audio = document.getElementById('tdv-global-ambient-audio');
        if (!audio) return;
        var isMuted = localStorage.getItem('tdv_audio_muted') === 'true';
        if (isMuted) {
          audio.muted = true;
          audio.volume = 0;
          return;
        }

        audio.volume = 0.5;
        audio.muted = false;

        var cleanup = function () {
          unlockEvents.forEach(function (e) {
            window.removeEventListener(e, onUserInteraction, true);
            document.removeEventListener(e, onUserInteraction, true);
          });
        };

        // 1. Attempt unmuted autoplay immediately on page load
        var startPlay = function () {
          if (localStorage.getItem('tdv_audio_muted') === 'true' || document.hidden) return;
          audio.muted = false;
          audio.volume = 0.5;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function () {
              audio.muted = false;
              audio.volume = 0.5;
              if ('mediaSession' in navigator && typeof MediaMetadata !== 'undefined') {
                try {
                  navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Underwater Ambiance',
                    artist: 'The Dive Village',
                    album: "It is a Community",
                    artwork: [{ src: 'https://res.cloudinary.com/q7b4kjd9/image/upload/v1791691225/TDV-Media/UI/Logo.png', sizes: '512x512', type: 'image/png' }]
                  });
                } catch (e) {}
              }
              cleanup();
            }).catch(function () {
              // Browser blocked unmuted autoplay: keep audio paused at 0:00 rather than
              // playing silently in background, so playback starts cleanly without missing sound
              audio.pause();
              try { audio.currentTime = 0; } catch (e) {}
              audio.muted = false;
            });
          }
        };

        // 2. Comprehensive interaction matrix: unmutes and plays cleanly on ANY presence
        var unlockEvents = [
          'pointerdown',
          'touchstart',
          'mousedown',
          'keydown',
          'click',
          'wheel',
          'scroll',
          'mousemove'
        ];

        var onUserInteraction = function () {
          if (localStorage.getItem('tdv_audio_muted') === 'true' || document.hidden) return;
          audio.muted = false;
          audio.volume = 0.5;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function () {
              audio.muted = false;
              audio.volume = 0.5;
              cleanup();
            }).catch(function () {});
          }
        };

        unlockEvents.forEach(function (e) {
          window.addEventListener(e, onUserInteraction, { capture: true, passive: true });
          document.addEventListener(e, onUserInteraction, { capture: true, passive: true });
        });

        startPlay();
        document.addEventListener('DOMContentLoaded', startPlay, { once: true });
        window.addEventListener('load', startPlay, { once: true });
      } catch (e) {}
    })();
  </script>
